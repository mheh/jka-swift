# The project file of the generator pipeline.
# closure.py and table.py read it with tomllib, and every path in it is relative to the repository root unless a key says otherwise.

[project]
# The C tree the units parse.
source_root = "oracle"
# The language the generators write.
target_language = "swift"

[sweep]
# The unit a generator run reads when its command line names no `--unit`.
unit = "mp-game"

# One row per unit that a generator run takes with `--unit`, and every fact of that unit that a generator reads.
# `other` is the unit beside it that a proof over every caller reads too, and its folder comes from its own row.
# `folder` holds the unit's own source files, relative to the source root, and `traps` is the file of that folder that holds the trap table.
# `logic` is the Swift target of the stubs, `views` is the view target, and `c_target` is the C target that the traps import.
# `state` names the state files and the state object of the logic target: `<state>Variables`, `<state>Storage`, and `<state>World`.
# `rust` is the jka-rust crate under `jka-rust/crates/mp` that the manifest reads beside `bg` and `qshared`.
# `store` is the table cache of the unit's sweeps, one SQLite file outside version control.
# `borrowed` lists the .c files of another folder that the unit's build compiles too, which the unit's stubs mirror with Source lines in that folder.
# `borrowed_rust` lists the jka-rust files under `jka-rust/crates/mp` that the manifest reads first for a borrowed file.
# A unit whose `logic` target is not under the output root yet writes every file of its run under `tools/oracle-closure/out/<unit>/`.
# `kind` is `module` when the row has no such key, a game module with a trap file and a vmMain shell.
# A `host` row is an engine that loads the modules, and it names no trap file and no shell.
# The skeleton of a host reads every file of the unit's `srcglob` less the files of `deferred`, and the plain functions of a .cpp file.
# The `rust` key of a host is a list of crates under `jka-rust/crates/mp`.
[targets.mp-game]
other = "mp-cgame"
folder = "codemp/game"
traps = "g_syscalls.c"
logic = "JKAMP_GameLogic"
views = "JKAMP_Game"
c_target = "CJKAMP_Game"
state = "Game"
rust = "game"
store = "tools/oracle-closure/table.sqlite"

[targets.mp-cgame]
other = "mp-game"
folder = "codemp/cgame"
traps = "cg_syscalls.c"
logic = "JKAMP_CGameLogic"
views = "JKAMP_CGame"
c_target = "CJKAMP_CGame"
state = "CGame"
rust = "cgame"
store = "tools/oracle-closure/out/mp-cgame/table.sqlite"
# Raven's cgame build compiles these game files a second time, oracle/codemp/cgame/JK2_cgame.vcproj:294-303.
borrowed = [
    "codemp/game/AnimalNPC.c",
    "codemp/game/FighterNPC.c",
    "codemp/game/SpeederNPC.c",
    "codemp/game/WalkerNPC.c",
    # Raven's cgame build compiles the ui file under CGAME too, oracle/codemp/cgame/JK2_cgame.vcproj:471.
    "codemp/ui/ui_shared.c",
]
borrowed_rust = [
    "bg/src/vehicles",
    "cgame/src/vehicle_npc.rs",
    "uishared/src",
]

# The MP dedicated server, Raven's WinDed.vcproj, rows E4, E5, E6, and E11 of notes/2026-11-03/dedicated-opening-docket.md.
[targets.mp-engine-ded]
kind = "host"
other = "mp-game"
# A host has no single folder. Each file of its link set outside this folder stands as a borrowed file of the unit.
folder = "codemp/server"
logic = "JKAMP_DedLogic"
views = "JKAMP_Ded"
c_target = "CJKAMP_Ded"
state = "Engine"
rust = [
    "engine/qcommon",
    "engine/server",
    "engine/core",
]
store = "tools/oracle-closure/out/mp-engine-ded/table.sqlite"
# The files of the link set that the skeleton writes no stub for in this stage, by the rows under the srcglob of the unit.
# Stage E5 gives stubs to the Ghoul2 files and the renderer files of the dedicated build, WinDed.vcproj:301-425, whose DEDICATED arms Raven compiles.
# It also gives stubs to cm_terrain.cpp and RM_Manager.cpp, the files that define CCMLandScape and TheRandomMissionManager of cm_load.cpp:800 to :809.
# The seventh batch gives stubs to the botlib, ICARUS, the NPC navigator, and the ROFF system, WinDed.vcproj:144, :365 to :368, :461 to :605, and :736 to :787.
# The fork links the same files, MPBotlibBotlibFiles, MPEngineAndDedIcarusFiles, MPEngineAndDedServerFiles, and RoffSystem.cpp of openjk/codemp/CMakeLists.txt:62 to :336.
deferred = [
    "codemp/renderer/*.c",
    "codemp/png/*.cpp",
    "codemp/zlib32/*.cpp",
    "codemp/qcommon/cm_draw.cpp",
    "codemp/qcommon/cm_randomterrain.cpp",
    "codemp/RMG/RM_Area.cpp",
    "codemp/RMG/RM_Instance.cpp",
    "codemp/RMG/RM_Instance_BSP.cpp",
    "codemp/RMG/RM_Instance_Group.cpp",
    "codemp/RMG/RM_Instance_Random.cpp",
    "codemp/RMG/RM_Instance_Void.cpp",
    "codemp/RMG/RM_InstanceFile.cpp",
    "codemp/RMG/RM_Mission.cpp",
    "codemp/RMG/RM_Objective.cpp",
    "codemp/RMG/RM_Path.cpp",
    "codemp/RMG/RM_Terrain.cpp",
]

[output]
# The root of the generated targets.
root = "Sources"
# The folders under the root that hold the stubs, beside the `logic` target of the unit.
# The first line of each stub decides whether the stub is adopted.
stubs = ["JKAMP_BG", "JKAShared"]
# The generated declarations under the root that the views read for the module of a name, as globs.
# `{views}` stands for the `views` target of the unit.
declarations = [
    "JKAShared/Generated/*.swift",
    "JKAMP/Generated/*.swift",
    "{views}/Generated/*.swift",
    "JKAShared/Generated/Views/Callbacks.swift",
    "JKAMP/Generated/Views/Callbacks.swift",
    "{views}/Generated/Views/Callbacks.swift",
]

[store]
# The tool modules whose logic feeds the facts, relative to this folder.
# A change to one of them invalidates every fact in the store.
modules = [
    "table.py",
    "spelling.py",
    "rulings.py",
    "overlay.py",
    "views.py",
    "reexport.py",
    "closure.py",
    "fnsweep.py",
    "store.py",
    "project.toml",
]
# The modules of the lowering, whose logic feeds the lowered rows, relative to this folder.
# A change to one of them invalidates every lowered row, and so does a change to the declaration lines of a destination file.
lowering = [
    "bodies.py",
    "draft_statements.py",
    "draft_expressions.py",
    "draft_calls.py",
    "draft_declarations.py",
    "draft_classification.py",
    "layout.py",
    "lowering_key.py",
    "skeleton.py",
]

# The units: the compile profile of each parse, mirrored from Raven's vcproj Release configs.
# `entry` is the hand list of headers for the header parse, and a unit without it reads the list closure.py derives from `srcglob`.

# bg_* compiles into game/cgame/ui; parse it through the game TU. Alias
# so tier-named callers (crate mp_bg) resolve without knowing that.

# The header parse reads the derived entry list of closure.py: each oracle header a bg .c file includes, in order of first reach.
# A header that another listed header reaches is left out, and a header the exclude list names is left out too.
[units.mp-bg]
name = "mp-bg"
lang = "c"
includes = [
    "codemp/game",
]
defines = [
    "NDEBUG",
    "MISSIONPACK",
    "QAGAME",
    "_JK2",
]
srcglob = [
    "codemp/game/bg_*.c",
]
exclude = [
    "codemp/game/g_local.h",
]

# botlib headers assume the classic Q3 include order (q_shared -> l_* ->
# aasfile -> botlib -> be_*); the entry list reproduces it.
# NB: the botlib interface header is codemp/game/botlib.h (there is no
# codemp/botlib/botlib.h) — Raven's be_* files include it cross-dir.
[units.mp-botlib]
name = "mp-botlib"
lang = "c"
entry = [
    "codemp/game/q_shared.h",
    "codemp/botlib/l_crc.h",
    "codemp/botlib/l_libvar.h",
    "codemp/botlib/l_log.h",
    "codemp/botlib/l_memory.h",
    "codemp/botlib/l_script.h",
    "codemp/botlib/l_precomp.h",
    "codemp/botlib/l_struct.h",
    "codemp/botlib/l_utils.h",
    "codemp/botlib/aasfile.h",
    "codemp/game/botlib.h",
    "codemp/game/be_aas.h",
    "codemp/game/be_ai_char.h",
    "codemp/game/be_ai_chat.h",
    "codemp/game/be_ai_gen.h",
    "codemp/game/be_ai_goal.h",
    "codemp/game/be_ai_move.h",
    "codemp/game/be_ai_weap.h",
    "codemp/game/be_ea.h",
    "codemp/botlib/be_aas_def.h",
    "codemp/botlib/be_aas_funcs.h",
    "codemp/botlib/be_aas_bsp.h",
    "codemp/botlib/be_aas_cluster.h",
    "codemp/botlib/be_aas_debug.h",
    "codemp/botlib/be_aas_entity.h",
    "codemp/botlib/be_aas_file.h",
    "codemp/botlib/be_aas_main.h",
    "codemp/botlib/be_aas_move.h",
    "codemp/botlib/be_aas_optimize.h",
    "codemp/botlib/be_aas_reach.h",
    "codemp/botlib/be_aas_route.h",
    "codemp/botlib/be_aas_routealt.h",
    "codemp/botlib/be_aas_sample.h",
    "codemp/botlib/be_ai_weight.h",
    "codemp/botlib/be_interface.h",
]
includes = [
    "codemp/botlib",
    "codemp/game",
    "codemp",
]
defines = [
    "NDEBUG",
    "MISSIONPACK",
    "BOTLIB",
    "_JK2",
]

# The header parse reads the derived entry list of closure.py: each oracle header a cgame, bg, or ui_shared .c file includes, in order of first reach.
# A header that another listed header reaches is left out, so a header with no include guard is parsed once.
[units.mp-cgame]
name = "mp-cgame"
lang = "c"
includes = [
    "codemp/cgame",
    "codemp/game",
    "codemp/ui",
]
defines = [
    "NDEBUG",
    "MISSIONPACK",
    "CGAME",
    "_JK2",
]
# The four vehicle NPC files of the game folder are Raven's list at oracle/codemp/cgame/JK2_cgame.vcproj:294-303.
srcglob = [
    "codemp/cgame/*.c",
    "codemp/game/AnimalNPC.c",
    "codemp/game/FighterNPC.c",
    "codemp/game/SpeederNPC.c",
    "codemp/game/WalkerNPC.c",
    "codemp/game/bg_*.c",
    "codemp/ui/ui_shared.c",
]

# client.h pulls tr_public/ui_public/keys/snd_public/cg_public/bg_public.
# keys.h -> ../ui/keycodes.h (MP keycodes are ui-owned). snd_local.h pulls
# vendored-but-parseable OpenAL headers + mp3struct.h (channel_t embeds
