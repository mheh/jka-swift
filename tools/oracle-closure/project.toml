    "NDEBUG",
    "_IMMERSION",
    "USHORT=unsigned short",
    "BOOL=int",
    "UINT=unsigned int",
    "FLOAT=float",
    "HDC=void *",
    "HGLRC=void *",
    "DECLARE_HANDLE(name)=typedef void *name",
]
