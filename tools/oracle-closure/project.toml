# DEDICATED-SERVER function sweep (WinDed.vcproj Release). Unlike mp-engine
# (header-only type sweep), this carries a srcglob so fnsweep.py can unity-
# parse whole-subsystem .cpp bodies. Defines mirror WinDed Release exactly:
#   WIN32,NDEBUG,_CONSOLE,DEDICATED,BOTLIB,_WINDOWS
# WIN32/_CONSOLE/_WINDOWS dropped per NOTES decision #1 (gate macros/asm,
# not layouts/bodies); DEDICATED+BOTLIB kept — DEDICATED is the whole point
# (it #ifndef's out the client/GL/sound halves of qcommon/server/renderer,
# leaving exactly the headless host + server-side model/G2 loading). NB the
# WinDed *Release* config oddly omits _JK2/MISSIONPACK (its Debug config has
# _JK2); kept faithful. The whole engine is C++ (.cpp), so lang=c++.
# srcglob is the WinDed Release link set file by file, and the comments at the key give the rows.
# Renderer files pull tr_local.h->qgl.h->GL, so the glshim include dir +
# GL/win32 scalar-typedef defines from mp-renderer are merged in; -fdeclspec
# for tr_local's __declspec(align), -fno-operator-names for its `or` fields.
[units.mp-engine-ded]
name = "mp-engine-ded"
lang = "c++"
# The header parse reads the stage 1 headers by hand, in the shape of mp-engine, and no botlib header, row T2.
# The renderer header tr_local.h joins the list for the records of `tr`, the models, and the shaders, row TR1 of notes/2026-11-09/dedicated-open-rows-ledger-8.md.
# stringed_ingame.h joins the list for its constants, row S4 of that ledger.
# The null folder has no header of its own.
# cm_local.h reaches <list> through cm_landscape.h, and the foreign triples have no C++ library, so their parse stops there.
# The lp64 asserts alone cover the C++ reach of cm_local.h, row S2, and the ilp32 and llp64 blocks say "did not parse for" at each such record.
entry = [
    "codemp/qcommon/qcommon.h",
    "codemp/qcommon/qfiles.h",
    "codemp/qcommon/cm_local.h",
    "codemp/qcommon/cm_patch.h",
    "codemp/qcommon/files.h",
    "codemp/qcommon/vm_local.h",
    "codemp/server/server.h",
    "codemp/win32/win_local.h",
    "codemp/win32/resource.h",
    "codemp/renderer/tr_local.h",
    "codemp/qcommon/stringed_ingame.h",
]
includes = [
    "codemp/qcommon",
    "codemp/server",
    "codemp/botlib",
    "codemp/ghoul2",
    "codemp/icarus",
    "codemp/RMG",
    "codemp/renderer",
    "codemp/cgame",
    "codemp/game",
    "codemp",
    "../tools/oracle-closure/glshim",
]
defines = [
    "NDEBUG",
    "DEDICATED",
    "BOTLIB",
    "LPCTSTR=const char *",
    "COLORREF=unsigned int",
    "DWORD=unsigned int",
    "WORD=unsigned short",
    "BYTE=unsigned char",
    "HANDLE=void *",
    "LPVOID=void *",
    "stricmp=strcasecmp",
    "strnicmp=strncasecmp",
    "USHORT=unsigned short",
    "BOOL=int",
    "UINT=unsigned int",
    "FLOAT=float",
    "HDC=void *",
    "HGLRC=void *",
    "DECLARE_HANDLE(name)=typedef void *name",
    # WinVars_t of win_local.h holds these Windows types, and OSVERSIONINFO takes the layout of the Windows SDK's OSVERSIONINFOA.
    "HINSTANCE=void *",
    "HWND=void *",
    "OSVERSIONINFO=struct { unsigned int dwOSVersionInfoSize; unsigned int dwMajorVersion; unsigned int dwMinorVersion; unsigned int dwBuildNumber; unsigned int dwPlatformId; char szCSDVersion[128]; }",
    # WinDed has no PATH_MAX, so MAX_OSPATH of q_shared.h:394 is 256, row S4. The macOS SDK defines PATH_MAX in sys/syslimits.h alone,
    # so the host parse takes that header's guard, and every triple sees no PATH_MAX.
    "_SYS_SYSLIMITS_H_",
    # WinDed defines WIN32, and q_shared.h:178 gives PATH_SEP under it. The host parse defines no WIN32, so it takes WinDed's value here,
    # the form of the mp-renderer row, and `*s = PATH_SEP` of files_common.cpp:282 parses as the store it is.
    "PATH_SEP='\\\\'",
    # win_net.cpp:27 to :29 declare the sockets as Winsock's SOCKET with INVALID_SOCKET, which the host parse lacks, so the writes of NET_OpenIP parse.
    # The values are the ones of SysBackend.swift, an int descriptor and -1.
    "SOCKET=int",
    "INVALID_SOCKET=(-1)",
]
flags = [
    "-fdeclspec",
    "-fno-operator-names",
]
# The WinDed Release link set, oracle/codemp/WinDed.vcproj:138-894, file by file in the order of the project file, ruled by row E8.
# Row E13 keeps vm.cpp and vm_interpreted.cpp and leaves vm_x86.cpp out, WinDed.vcproj:290.
# Row E5 ports qcommon, server, null, and win32 in stage 1.
