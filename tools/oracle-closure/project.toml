    "BOOL=int",
    "UINT=unsigned int",
    "FLOAT=float",
    "HDC=void *",
    "HGLRC=void *",
    "DECLARE_HANDLE(name)=typedef void *name",
    "LPCTSTR=const char *",
    "LPCSTR=const char *",
