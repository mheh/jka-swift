    "codemp/qcommon",
    "codemp/renderer",
    "codemp/ui",
    "codemp/cgame",
    "codemp",
    "../tools/oracle-closure/glshim",
]
defines = [
    "NDEBUG",
    "MISSIONPACK",
    "_JK2",
    "LPCTSTR=const char *",
    "COLORREF=unsigned int",
    "DWORD=unsigned int",
    "WORD=unsigned short",
    "BYTE=unsigned char",
    "HANDLE=void *",
    "LPVOID=void *",
    "stricmp=strcasecmp",
    "strnicmp=strncasecmp",
