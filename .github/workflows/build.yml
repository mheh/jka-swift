name: Build the game module

# This workflow runs on a push to master and on request, never on a pull request.
# It builds the `jampgame` library as a release shared library on each platform the engine loads, and it packages each one as a zip.
# The pipeline comes from jka-rust (jka-rust/.github/workflows/build.yml), without its approval gate.
# The lane shapes come from Vapor's shared workflow (vapor/ci, run-unit-tests.yml): the Linux lanes run in the official Swift image,
# the Windows lane takes the toolchain from compnerd/gha-setup-swift, every action is pinned to a commit, and every job has a timeout.
#
# The file inside each zip keeps the exact arch-suffixed name the engine expects at load time, because the engine refuses to load a renamed module.
# The platform lives in the zip name, never in the module filename:
#
#   Linux   64-bit  x86_64   jampgamex86_64.so
#   Windows 64-bit  x86_64   jampgamex86_64.dll
#
# No macOS lane runs for now, by the user's word of 2026-10-28, so the arm64 dylib stays a local build.
# The `test` job runs the Swift tests on Linux and does not gate the build matrix.
# The tests run one suite at a time, because they share the module's one world and one bg state.
# The build names the product alone, because the `jampsmoke` executable imports Darwin and has no Linux or Windows build.
# The package step asks SwiftPM for its product folder, because the 6.4 build system places products under .build/out/Products/Release.
#
# The zip names carry no version segment, so the rolling `latest` release keeps stable download URLs.
# The release body records the built commit.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_IMAGE: swift:6.4-noble
  SWIFT_WINDOWS_BRANCH: swift-6.4.1-release
  SWIFT_WINDOWS_TAG: 6.4.1-RELEASE

jobs:
  test:
    name: Swift tests on Linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    timeout-minutes: 60
    steps:
      - name: Install curl and zstd for the cache
        run: apt-get update -yq && apt-get install -y curl zstd

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the build folder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: test-${{ env.SWIFT_IMAGE }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: test-${{ env.SWIFT_IMAGE }}-

      - name: Build the library
        run: swift build --product jampgame

      - name: Run the tests one suite at a time
        run: swift test --no-parallel

  build-linux:
    name: jampgame x86_64-linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    timeout-minutes: 60
    steps:
      - name: Install curl, zstd, and 7z for the cache and the zip
        run: apt-get update -yq && apt-get install -y curl zstd p7zip-full

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the build folder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: linux-x86_64-release-${{ env.SWIFT_IMAGE }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: linux-x86_64-release-${{ env.SWIFT_IMAGE }}-

      - name: Build the release library
        run: swift build -c release --product jampgame

      - name: Package the zip
        shell: bash
        run: |
          module="jampgamex86_64.so"
          bin="$(swift build -c release --product jampgame --show-bin-path)"
          src="${bin}/libjampgame.so"
          test -f "$src" || { echo "::error::built module not found at $src"; ls -l "$bin"; exit 1; }
          zip_name="jampgame-x86_64-linux-release.zip"
          rm -rf package dist
          mkdir -p package dist
          cp "$src" "package/${module}"
          ( cd package && 7z a -tzip tmp.zip "${module}" >/dev/null )
          mv package/tmp.zip "dist/${zip_name}"
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

  build-windows:
    name: jampgame x86_64-windows
    runs-on: windows-latest
    timeout-minutes: 60
    # The lane is allowed to fail until it proves itself.
    continue-on-error: true
    steps:
      - name: Install the Windows Swift toolchain
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: ${{ env.SWIFT_WINDOWS_BRANCH }}
          swift-build: ${{ env.SWIFT_WINDOWS_TAG }}

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the build folder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: windows-x86_64-release-${{ env.SWIFT_WINDOWS_TAG }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: windows-x86_64-release-${{ env.SWIFT_WINDOWS_TAG }}-

      - name: Build the release library
        run: swift build -c release --product jampgame

      - name: Package the zip
        shell: bash
        run: |
          module="jampgamex86_64.dll"
          bin="$(swift build -c release --product jampgame --show-bin-path)"
          src="${bin}/jampgame.dll"
          test -f "$src" || { echo "::error::built module not found at $src"; ls -l "$bin"; exit 1; }
          zip_name="jampgame-x86_64-windows-release.zip"
          rm -rf package dist
          mkdir -p package dist
          cp "$src" "package/${module}"
          ( cd package && 7z a -tzip tmp.zip "${module}" >/dev/null )
          mv package/tmp.zip "dist/${zip_name}"
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

  release:
    name: Update the rolling release
    needs: [build-linux, build-windows]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # The job attaches assets to the rolling release.
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List the collected zips
        run: ls -lR dist

      - name: Delete the stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no rolling release yet, nothing to delete"
            exit 0
          fi
          for asset in $(gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            if [ ! -f "dist/${asset}" ]; then
              echo "deleting stale asset: ${asset}"
              gh release delete-asset latest "${asset}" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - name: Publish the rolling latest release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          name: Rolling build (master)
          prerelease: true
          body: |
            Automated build of `master` at ${{ github.sha }}.
            Each zip holds the game module under the exact name the engine loads, `jampgamex86_64.so` or `jampgamex86_64.dll`.
            The asset URLs stay the same from build to build.
          files: dist/*.zip
          fail_on_unmatched_files: false
